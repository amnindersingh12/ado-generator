name: lock-refresh (temporary)
on:
  push:
    branches: [chore/maintenance]
    paths: [.github/workflows/lock-refresh.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: |
          bundle config set frozen false
          bundle lock --update rails --add-platform x86_64-linux
      - run: |
          git config user.name "amnindersingh12"
          git config user.email "amnindersingh58611@gmail.com"
          git add Gemfile.lock
          git commit -m "chore: re-resolve Gemfile.lock (Rails 8.1)" || echo "nothing to commit"
          git push
